[package]
name = "metis-viewer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Metis RDP viewer — GTK connect UI over FreeRDP (GRD host unchanged)"

[[bin]]
name = "metis-viewer"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.8", features = ["v4_10"] }
glib = "0.19"
gio = "0.19"
metis-config = { workspace = true }
metis-i18n = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = "1"

name: Cargo audit

on:
  pull_request:
    paths:
      - "metis-os-workspace/Cargo.lock"
      - "metis-os-workspace/**/Cargo.toml"
      - "metis-os-workspace/audit.toml"
      - ".github/workflows/audit.yml"
  push:
    branches: [main, master]
    paths:
      - "metis-os-workspace/Cargo.lock"
      - "metis-os-workspace/**/Cargo.toml"
      - "metis-os-workspace/audit.toml"

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metis-os-workspace
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit

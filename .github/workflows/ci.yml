name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GTK4_LAYER_SHELL_TAG: "v1.3.0"

jobs:
  quality:
    name: fmt · clippy · test · deny
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: metis-os-workspace
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libclang-dev \
            libgtk-4-dev libadwaita-1-dev \
            libudev-dev libinput-dev libseat-dev \
            libgbm-dev libdrm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdisplay-info-dev libpam0g-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            liblcms2-dev \
            libwayland-dev wayland-protocols \
            libeis-dev \
            libgirepository1.0-dev gobject-introspection \
            meson ninja-build valac \
            curl git gettext

      - name: Build and install gtk4-layer-shell
        working-directory: ${{ github.workspace }}
        run: |
          ./metis-os-workspace/scripts/fetch-gtk4-layer-shell.sh /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup build --prefix=/usr/local -Dexamples=false -Ddocs=false -Dtests=false
          ninja -C build
          sudo ninja -C build install
          echo "/usr/local/lib/x86_64-linux-gnu" | sudo tee /etc/ld.so.conf.d/gtk4-layer-shell.conf
          sudo ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"
          pkg-config --modversion gtk4-layer-shell-0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: metis-os-workspace -> target
          shared-key: ci-ubuntu-24.04

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: cargo deny
        run: cargo deny check

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
